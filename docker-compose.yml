version: "3.8"

services:
  # Contenedor de Base de Datos
  db:
    image: mysql:8.0
    container_name: scafi-mysql
    restart: always
    command: --port=3307
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword # Cambia esto por una contraseña segura
      MYSQL_DATABASE: scafi # Nombre de la base de datos que tu API espera
    ports:
      - "3307:3306"
    volumes:
      # Monta los scripts SQL para que se autoejecuten al iniciar por primera vez
      - ./db-init:/docker-entrypoint-initdb.d
      # Volumen para persistir los datos aunque se apague el contenedor
      - db_data:/var/lib/mysql

  # Contenedor del Backend PHP
  api:
    build:
      context: ./scafi-api
      dockerfile: Dockerfile
    container_name: scafi-php-api
    restart: always
    ports:
      - "8080:80" # El API estará accesible en http://localhost:8080
    volumes:
      # Monta el código en tiempo real para reflejar cambios sin reconstruir
      - ./scafi-api:/var/www/html
    depends_on:
      - db

  # Contenedor del Frontend Angular
  frontend:
    build:
      context: ./scafi-app-nuevo
      dockerfile: Dockerfile
    container_name: scafi-angular-app
    restart: always
    ports:
      - "4200:80" # La app estará accesible en http://localhost:4200
    depends_on:
      - api

volumes:
  db_data:
