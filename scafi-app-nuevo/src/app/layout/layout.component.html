<div class="h-screen flex flex-col overflow-hidden">
  <!-- HEADER -->
  <header class="bg-[#1e1e1e] text-white flex items-center justify-between px-6 py-3 shadow-xl z-50">
    <!-- BUSCADOR -->
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (keyup.enter)="search()"
      placeholder="Buscar módulo..."
      class="bg-slate-700 px-4 py-2 rounded-full text-sm w-72 outline-none"
    />

    <!-- DERECHA -->
    <div class="flex items-center gap-6">
      <!-- NOTIFICACIONES -->
      <div
        class="relative"
        *ngIf="user?.id"
      >
        <button (click)="toggleNoti()" class="relative text-2xl hover:text-yellow-400 transition">
          <!-- Ícono campana -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3c0 .386-.149.735-.405 1.005L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>

          <!-- Contador -->
          <span *ngIf="totalNoLeidas > 0"
            class="absolute -top-2 -right-2 bg-red-500 text-white text-xs min-w-5 h-5 px-1 rounded-full flex items-center justify-center">
            {{ totalNoLeidas }}
          </span>
        </button>

        <!-- PANEL -->
        <div *ngIf="showNoti"
          class="absolute right-0 mt-4 w-96 bg-white text-black rounded-2xl shadow-2xl overflow-hidden z-50">
          <div class="bg-slate-900 text-white p-4 font-bold">Notificaciones</div>
          <div *ngFor="let n of notificaciones.slice(0, 10)"
     (click)="abrirNotificacion(n)"
     class="p-4 border-b hover:bg-gray-100 transition cursor-pointer"
     [ngClass]="{
       'bg-blue-50': n.visto_por == null,
       'bg-white': n.visto_por != null
     }">

  <div class="flex justify-between items-start">

    <div>

      <div class="font-bold text-red-500">
        {{ n.titulo }}
      </div>

      <div class="text-sm text-gray-700 mt-1">
        {{ n.mensaje }}
      </div>

      <div class="text-xs text-gray-400 mt-2">
        {{ n.fecha }}
      </div>

      <button
        type="button"
        (click)="$event.stopPropagation(); abrirNotificacion(n)"
        class="mt-2 text-xs text-blue-600 font-bold hover:underline">

        → Ver dónde ocurrió

      </button>

      <div
        *ngIf="n.nombre_remitente"
        class="text-xs text-blue-600 mt-1 font-semibold">

        Enviado por: {{ n.nombre_remitente }}

      </div>

    </div>

    <button
      (click)="$event.stopPropagation(); marcarLeida(n.id)"
      class="text-green-600 text-lg hover:text-green-800"
      [title]="n.visto_por != null ? 'Ya leída' : 'Marcar como leída'">

      {{ n.visto_por != null ? '✓' : '✓' }}

    </button>

  </div>

</div>

<!-- VER TODO SOLO UNA VEZ -->
<div
  class="p-3 text-center border-t bg-gray-50">

  <a
    routerLink="/notificaciones"
    class="text-green-600 font-semibold hover:underline">

    Ver todo

  </a>

</div>

          <div *ngIf="notificaciones.length === 0" class="p-6 text-center text-gray-500">Sin notificaciones</div>
        </div>
      </div>
      
      <!-- MENSAJES -->
      <button *ngIf="user?.idRol == 1 || user?.idRol == 2 || user?.idRol == 3"
        routerLink="/mensajes"
        class="text-2xl hover:text-green-400 transition"
      >
        <!-- Ícono chat -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.77 9.77 0 01-4-.84L3 20l1.84-3.68A7.97 7.97 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </button>

      <!-- PERFIL -->
      <a
        routerLink="/perfil"
        class="flex items-center gap-3 group"
        title="Ver mi perfil"
      >
        <div
          *ngIf="user"
          class="w-10 h-10 rounded-full overflow-hidden bg-green-600
                 flex items-center justify-center font-bold
                 ring-2 ring-white/20 shadow-md
                 group-hover:ring-green-300 transition"
        >
          <img
            *ngIf="user?.foto && !fotoError"
            [src]="getFotoUrl(user.foto)"
            [alt]="user?.nombre || 'Usuario'"
            class="w-full h-full object-cover"
            (error)="fotoError = true"
          />

          <span *ngIf="!user?.foto || fotoError">
            {{ user?.nombre?.charAt(0)?.toUpperCase() || '?' }}
          </span>
        </div>

        <div>
          <div class="font-semibold text-sm group-hover:text-green-300 transition">
            {{ user?.nombre }}
          </div>
          <div class="text-xs text-gray-300">
            {{ getRolNombre() }}
          </div>
        </div>
      </a>

      <!-- SALIR -->
      <button (click)="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm transition">
        Salir
      </button>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="flex-1 overflow-auto bg-cover bg-center" style="background-image: url('assets/cafe.jpg');">
    <router-outlet></router-outlet>
  </main>
</div>
