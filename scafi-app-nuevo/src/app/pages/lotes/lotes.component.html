<div class="text-white">

  <div class="grid grid-cols-2 gap-6">

    <!-- FORM -->
    <div class="bg-white text-black p-6 rounded-3xl shadow-xl">

      <h2 class="text-3xl font-bold text-green-700 mb-6">
        🗺️ Registrar Lote
      </h2>

      <input
        type="text"
        [(ngModel)]="nombreLote"
        placeholder="Nombre del lote"
        class="w-full mb-4 p-4 border rounded-xl"
      />

      <input
        type="text"
        [(ngModel)]="ubicacion"
        placeholder="Ubicación"
        class="w-full mb-4 p-4 border rounded-xl"
      />

      <input
        type="number"
        [(ngModel)]="hectareas"
        placeholder="Hectáreas"
        class="w-full mb-6 p-4 border rounded-xl"
      />

      <!-- ESTADO INICIAL -->
      <div class="w-full mb-6 p-4 rounded-xl bg-green-50 border border-green-200">

        <div class="flex items-center gap-3">

          <span class="w-3 h-3 rounded-full bg-green-500"></span>

          <div>
            <p class="font-bold text-green-700">
              Estado inicial: Activo
            </p>

            <p class="text-sm text-gray-600">
              Todo lote nuevo se registra automáticamente como activo.
            </p>
          </div>

        </div>

      </div>

      <button
        (click)="guardar()"
        class="w-full bg-green-700 hover:bg-green-800 text-white p-4 rounded-xl text-lg font-bold"
      >
        Guardar Lote
      </button>

    </div>

    <!-- TABLA -->
    <div class="bg-white text-black p-6 rounded-3xl shadow-xl">

      <h2 class="text-3xl font-bold mb-6">
        📋 Inventario de Lotes
      </h2>

      <!-- BUSCAR -->
      <input
        type="text"
        [(ngModel)]="buscar"
        placeholder="Buscar lote..."
        class="w-full mb-5 p-4 border rounded-xl"
      />

      <div class="overflow-auto max-h-[650px]">

        <table class="w-full text-sm">

          <thead class="bg-slate-800 text-white sticky top-0">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Lote</th>
              <th class="p-3">Ubicación</th>
              <th class="p-3">Hectáreas</th>
              <th class="p-3">Estado</th>
              <th class="p-3">Acción</th>
            </tr>
          </thead>

          <tbody>

            <tr
              *ngFor="let l of lotesFiltrados()"
              class="border-b hover:bg-gray-100"
            >

              <td class="p-3 text-center">
                {{ l.idLote }}
              </td>

              <td class="p-3 text-center">
                {{ l.nombreLote }}
              </td>

              <td class="p-3 text-center">
                {{ l.ubicacion }}
              </td>

              <td class="p-3 text-center">
                {{ l.hectareas }}
              </td>

              <td class="p-3 text-center">

                <span
                  class="inline-flex items-center justify-center min-w-[90px] px-3 py-1 rounded-xl text-white font-bold"
                  [ngClass]="l.estado === 'Activo' ? 'bg-green-600' : 'bg-red-600'"
                >
                  {{ l.estado }}
                </span>

              </td>

              <td class="p-3 text-center">

                <button
                  (click)="cambiarEstado(l)"
                  [ngClass]="l.estado === 'Activo'
                    ? 'bg-red-600 hover:bg-red-700'
                    : 'bg-green-600 hover:bg-green-700'"
                  class="text-white px-4 py-2 rounded-lg font-bold transition"
                >
                  {{ l.estado === 'Activo' ? 'Inactivar' : 'Activar' }}
                </button>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
